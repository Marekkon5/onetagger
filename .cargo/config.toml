[env]
# Build liblzma from its locked crate source instead of linking a build-machine Homebrew library.
LZMA_API_STATIC = "1"

# Mac OS libraries
[target.x86_64-apple-darwin]
rustflags = ["-lz", "-lbz2", "-C", "link-args=-framework AudioUnit"]

# Windows static build
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]

# Use lld for faster compile on Linux
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]


[target.aarch64-apple-darwin]
rustflags = ["-lz", "-lbz2", "-C", "link-args=-framework AudioUnit"]
