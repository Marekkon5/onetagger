name: Build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate GitHub workflow definitions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Validate release tooling and synchronized versions
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          python3 ci/release_tools.py check
      - name: Validate locked Rust dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - name: Build and typecheck locked frontend
        run: |
          pnpm --dir client install --frozen-lockfile
          pnpm --dir client run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: client/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build:
    name: ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-intel
          - name: macOS ARM64
            os: macos-26
            artifact: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: client/dist
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld autogen libasound2-dev pkg-config libssl-dev libwebkit2gtk-4.1-dev
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.artifact }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ matrix.artifact }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            rust-${{ matrix.artifact }}-
      - name: Regression tests
        run: cargo test --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/OneTagger-linux-x64.tar.gz -C target/release onetagger
          tar -czf dist/OneTagger-linux-x64-cli.tar.gz -C target/release onetagger-cli
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile vc_redist.x64.exe
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile MicrosoftEdgeWebview2Setup.exe
          $version = python -c "import tomllib; print(tomllib.load(open('crates/onetagger/Cargo.toml', 'rb'))['package']['version'] + '.0')"
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "/DPRODUCT_VERSION=$version" 'assets\installer.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/onetagger.exe dist/OneTagger-windows.exe
          Copy-Item target/release/onetagger-cli.exe dist/OneTagger-windows-cli.exe
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          python ci/package_macos.py
          python - <<'PYTHON'
          import subprocess
          for binary in ['target/release/onetagger', 'target/release/onetagger-cli']:
              libraries = subprocess.check_output(['otool', '-L', binary], text=True)
              print(libraries)
              for line in libraries.splitlines()[1:]:
                  dependency = line.strip().split(' (', 1)[0]
                  if not dependency.startswith(('/usr/lib/', '/System/Library/')):
                      raise SystemExit(f'{binary} depends on an unbundled library: {dependency}')
          PYTHON
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/osx/OneTagger.app dist/OneTagger-${{ matrix.artifact }}.zip
          zip -j dist/OneTagger-${{ matrix.artifact }}-cli.zip target/release/onetagger-cli
      - name: Generate checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(p for p in Path('dist').iterdir() if p.is_file())
          with Path('dist/SHA256SUMS-${{ matrix.artifact }}.txt').open('w') as output:
              for path in paths:
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  output.write(f'{digest}  {path.name}\n')
          PY
      - name: Record release artifact provenance
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: python ci/release_tools.py manifest "$RELEASE_PLATFORM" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onetagger-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Save compilation cache
        if: always() && !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  release-assets:
    name: Validate release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: onetagger-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
          digest-mismatch: error
      - name: Verify all packages, source metadata and checksums
        env:
          RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: python3 ci/release_tools.py verify "$RELEASE_ARTIFACTS"

  checks:
    name: Required checks
    if: always()
    needs: [frontend, build, release-assets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BUILD: ${{ needs.build.result }}
          RELEASE_ASSETS: ${{ needs.release-assets.result }}
        run: test "$FRONTEND" = success && test "$BUILD" = success && test "$RELEASE_ASSETS" = success
