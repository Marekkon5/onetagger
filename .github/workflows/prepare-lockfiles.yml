name: Prepare dependency lockfiles
on:
  push:
    branches: [fix/p1-safety-and-ci]
    paths: ['.github/workflows/prepare-lockfiles.yml', '**/Cargo.toml', 'client/package.json', 'rust-toolchain.toml']
permissions:
  contents: read
jobs:
  lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - name: Resolve lockfiles on GitHub
        run: |
          rustup show active-toolchain
          cargo update --workspace
          pnpm --dir client install --lockfile-only --ignore-scripts
      - name: Export lockfiles for review
        run: |
          python - <<'PY'
          import base64, io, zipfile
          data = io.BytesIO()
          with zipfile.ZipFile(data, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in ['Cargo.lock', 'client/pnpm-lock.yaml']:
                  archive.write(path)
          print('LOCKFILES_BASE64=' + base64.b64encode(data.getvalue()).decode())
          PY

