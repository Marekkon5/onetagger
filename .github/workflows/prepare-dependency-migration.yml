name: Prepare dependency migration
on:
  push:
    branches: [deps/quasar-extras-muda]
    paths: ['.github/workflows/prepare-dependency-migration.yml']
permissions:
  contents: read

jobs:
  lock:
    name: Resolve macOS dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the targeted Cargo lockfile patch
        run: |
          cargo update -p sysinfo --precise 0.38.4
          cargo update -p muda --precise 0.21.2
          cargo update -p objc2-app-kit --precise 0.3.2
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          python3 ci/release_tools.py check
          git diff --check -- Cargo.lock
          echo 'ONETAGGER_LOCKFILE_PATCH_BEGIN'
          git --no-pager diff --no-color -- Cargo.lock
          echo 'ONETAGGER_LOCKFILE_PATCH_END'
