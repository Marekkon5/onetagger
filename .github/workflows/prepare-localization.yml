name: Prepare interface localization
on:
  push:
    branches: [feature/interface-locales-v2.1.0]
    paths: ['.github/workflows/prepare-localization.yml', 'ci/prepare_localization_draft.py']
permissions:
  contents: read

jobs:
  drafts:
    name: Draft catalog (${{ matrix.locale }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        locale: [cs, pl, ja, ar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the offline inference tools
        run: |
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --only-binary=:all: 'transformers==4.57.3' 'ctranslate2==4.6.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
      - name: Draft message translations and report syntax requiring review
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          GITHUB_HELPER_REF: 09a7aa2160a821fd711e0531d821c17f9227d5e2
          TARGET_LANGUAGE: ${{ matrix.locale }}
        run: python ci/prepare_localization_draft.py "$TARGET_LANGUAGE"

  rtl-lockfile:
    name: Resolve the Quasar RTL build dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Generate the exact lockfile diff
        run: |
          pnpm --dir client add -D --save-exact --ignore-scripts --lockfile-only postcss-rtlcss@6.0.0
          git diff --check -- client/package.json client/pnpm-lock.yaml
          echo 'ONETAGGER_RTL_PATCH_BEGIN'
          git --no-pager diff --no-color -- client/package.json client/pnpm-lock.yaml
          echo 'ONETAGGER_RTL_PATCH_END'
