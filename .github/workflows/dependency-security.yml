name: Dependency security
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  audit:
    name: Compare dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: dependency-audit
          cache-workspace-crates: 'false'
      - name: Install pinned advisory scanner
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit current and baseline lockfiles
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/dependency_audit.py
      - name: Upload full audit reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-results
          path: dependency-audit-results/
          if-no-files-found: warn
          retention-days: 14
