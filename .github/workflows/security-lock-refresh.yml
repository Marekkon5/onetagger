name: Resolve audited security fixes
on:
  push:
    branches: [codex/security-provider-pacing]
    paths:
      - .github/workflows/security-lock-refresh.yml
permissions:
  contents: read
jobs:
  locks:
    if: github.repository == 'fantuz/onetagger'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Resolve advisory fixes on GitHub
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 update -p rusqlite --precise 0.41.0
          cargo +1.100.0 update -p libsqlite3-sys --precise 0.39.1
          cargo +1.100.0 update -p cookie --precise 0.18.3
          cargo +1.100.0 update -p crossbeam-epoch --precise 0.9.20
          cargo +1.100.0 update -p quinn-udp --precise 0.5.16
          cargo +1.100.0 update -p rkyv --precise 0.7.46
          cargo +1.100.0 update -p url --precise 2.5.9
          cargo +1.100.0 update -p webpki-roots@1.0.2 --precise 1.0.10
      - name: Commit only the resolved locks to this branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: python
        run: |
          import base64, json, os, pathlib, urllib.request
          root = 'https://api.github.com/repos/fantuz/onetagger'
          def api(path, data=None):
              request = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          parent = os.environ['EXPECTED_SHA']
          branch = '/git/refs/heads/codex/security-provider-pacing'
          assert api(branch)['object']['sha'] == parent, 'Branch moved; refusing stale locks'
          tree = []
          for name in ('Cargo.lock', 'client/pnpm-lock.yaml'):
              blob = api('/git/blobs', {'content': base64.b64encode(pathlib.Path(name).read_bytes()).decode(), 'encoding': 'base64'})
              tree.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          new_tree = api('/git/trees', {'base_tree': base_tree, 'tree': tree})
          commit = api('/git/commits', {'message': 'Resolve audited security fixes on GitHub', 'tree': new_tree['sha'], 'parents': [parent]})
          request = urllib.request.Request(root + branch, data=json.dumps({'sha': commit['sha'], 'force': False}).encode(), method='PATCH', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request) as response:
              print('Committed combined locks:', json.load(response)['object']['sha'])
