name: Prepare 2.2.0 codec fixtures
on:
  push:
    branches: [codex/onetagger-2.2.0]
    paths: [.github/workflows/prepare-220-fixtures.yml]
permissions:
  contents: write
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the fixture encoder
        run: |
          python3 ci/ubuntu_apt_mirrors.py
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate synthetic audio in each supported decoder format
        run: |
          python3 ci/audio_fixtures.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/onetagger-player/test-fixtures
          git commit -m 'Add synthetic codec fixtures generated on GitHub'
          git push
