name: Prepare maintenance lockfiles
on:
  push:
    branches: [maintenance/dependencies-docs]
    paths: [.github/workflows/prepare-maintenance-locks.yml, client/package.json, README.md, SECURITY.md]
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.11.0'
      - name: Resolve intentional updates
        run: |
          cargo update -p time --precise 0.3.55
          pnpm --dir client install --lockfile-only --ignore-scripts
          git diff --stat
      - name: Return reviewed lockfiles
        run: |
          python - <<'PYTHON'
          import base64, io, zipfile
          data = io.BytesIO()
          with zipfile.ZipFile(data, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in ['Cargo.lock', 'client/pnpm-lock.yaml']:
                  archive.write(path)
          print('LOCKFILES_BASE64=' + base64.b64encode(data.getvalue()).decode())
          PYTHON
      - name: Check README badges and documentation links
        run: |
          python - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from urllib.request import Request, urlopen
          import re
          import xml.etree.ElementTree as ET
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'img' and a.get('src', '').startswith('https://'):
                      with urlopen(Request(a['src'], headers={'User-Agent': 'OneTagger-docs-check'}), timeout=30) as r:
                          svg = ET.fromstring(r.read())
                      label = svg.attrib.get('aria-label', '')
                      if not label or any(s in label.lower() for s in ['not found', 'invalid', 'inaccessible', 'no status']):
                          raise SystemExit(f"Invalid badge: {a['src']} ({label})")
                      print(f"Badge OK: {label}")
                  if tag == 'a' and 'href' in a:
                      urls.append(a['href'])
          for file in ['README.md', 'SECURITY.md', 'docs/DEVELOPMENT.md']:
              text = Path(file).read_text()
              urls = re.findall(r'\[[^\]]*\]\(([^)]+)\)', text)
              Links().feed(text)
              for url in urls:
                  p = urlsplit(url)
                  if p.scheme or not p.path:
                      continue
                  target = Path(file).parent / unquote(p.path)
                  if not target.exists():
                      raise SystemExit(f'{file}: missing link target {target}')
              print(f'Local links OK: {file}')
          PYTHON
