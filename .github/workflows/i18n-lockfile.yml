name: Prepare localization dependency lock
on:
  push:
    branches: [feat/translations]
    paths: [client/package.json, .github/workflows/i18n-lockfile.yml]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: '10.11.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Resolve pinned localization dependency on GitHub
        run: pnpm --dir client install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Export lockfile for the review branch
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("client/pnpm-lock.yaml").read_bytes()).decode()
          for i in range(0, len(data), 4000):
              print("LOCKFILE_PART=" + data[i:i+4000])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: localization-lockfile
          path: client/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
