[package]
name = "onetagger-player"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
hound = "3.5"
lofty = "0.22"
anyhow = "1.0"

rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "vorbis", "ogg", "wav", "pcm", "adpcm", "alac", "aiff"] }

