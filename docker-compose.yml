services:
  onetagger:
    build:
      # Context is this repo. The Dockerfile builds from local source (COPY .), so uncommitted
      # edits to the wss/http handling are picked up on the next `docker compose build`.
      context: .
      dockerfile: Dockerfile
    image: onetagger-local:latest
    container_name: onetagger
    restart: unless-stopped

    # Bind to localhost only. The external Nginx (TLS + Authelia) proxies HTTPS to this,
    # same shape as the systemd setup it replaces. OneTagger speaks plain HTTP; the patched
    # client picks ws:// vs wss:// from window.location.protocol, so it works behind both.
    ports:
      - "127.0.0.1:36913:36913"

    volumes:
      # OneTagger config (Spotify/Discogs OAuth tokens, custom platform settings, etc).
      # Pre-create: `mkdir -p ./data/config && sudo chown -R 1000:1000 ./data/config`
      # otherwise compose creates it as root and the container user can't write to it.
      - ./data/config:/home/onetagger/.config/onetagger
      # Library mounts mirror the host's ReadWritePaths= policy:
      # on-hold is where tagging happens (rw), main is browsable but never written (ro).
      - /mnt/music/on-hold:/mnt/music/on-hold
      - /mnt/music/main:/mnt/music/main:ro

    # Run as host UID:GID so tag writes keep correct ownership on the mounted music tree.
    # Change if your host user isn't 1000:1000.
    user: "1000:1000"

    # Hardening the user-mode systemd unit couldn't apply (the AGENT.md "move to Docker" rationale).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
